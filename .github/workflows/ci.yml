name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

  onboard:
    name: Car program tests and SIL echo check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: onboard/pyproject.toml

      - run: npm ci

      - name: Install the car program
        run: pip install -e "onboard[test]"

      - name: Test the car program
        run: pytest onboard/tests

      # The car program echoes the privileged teacher, so the bridge run must match an in-process run bit for bit.
      - name: SIL echo check
        run: |
          python -m rushwick_onboard --hardware sim --listen 127.0.0.1:8765 --policy echo > onboard.log 2>&1 &
          npm run sim:echo-check -- --url ws://127.0.0.1:8765 --profile ideal --seed 3 --episodes 1 || { cat onboard.log; exit 1; }
