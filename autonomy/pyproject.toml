[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rushwick-autonomy"
version = "0.1.0"
description = "Rushwick Autonomy: the driving stack that runs on the vehicle, against the Rushwick simulator now and the real car later"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["websockets>=13", "numpy>=1.24"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16"]
test = ["pytest>=8"]
# Board extras. On the Jetson, install onnxruntime-gpu for your JetPack from the Jetson AI Lab index instead of the onnx extra.
pi = ["smbus2>=0.4", "gpiozero>=2.0", "lgpio>=0.2"]
jetson = ["smbus2>=0.4", "Jetson.GPIO>=2.1"]

[project.scripts]
rushwick-autonomy = "rushwick_autonomy.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rushwick_autonomy = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
