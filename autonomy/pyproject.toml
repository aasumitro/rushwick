[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rushwick-autonomy"
version = "0.1.0"
description = "Rushwick Autonomy: the driving stack that runs on the vehicle, against the Rushwick simulator now and the real car later"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["websockets>=13", "numpy>=1.24"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.16"]
test = ["pytest>=8"]

[project.scripts]
rushwick-autonomy = "rushwick_autonomy.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
