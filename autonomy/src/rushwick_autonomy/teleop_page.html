<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Rushwick teleop</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #0f1419; color: #e6edf3; display: flex; flex-direction: column; align-items: center; gap: 14px; touch-action: none; user-select: none; }
  #status { font-size: 14px; text-align: center; min-height: 2.8em; }
  #pad { width: min(80vw, 360px); aspect-ratio: 1; border-radius: 50%; background: #1f2a35; border: 3px solid #22d3ee; position: relative; }
  #pad.active { border-color: #2ee66b; }
  #knob { position: absolute; width: 22%; aspect-ratio: 1; border-radius: 50%; background: #22d3ee; left: 39%; top: 39%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { padding: 12px 16px; font-size: 16px; border-radius: 8px; border: 1px solid #22d3ee; background: #1f2a35; color: inherit; }
  button.on { background: #22d3ee; color: #0f1419; }
  #stop { border-color: #ff4d4f; color: #ff4d4f; }
  label { font-size: 14px; }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="pad" aria-label="Joystick: hold to drive, lift to brake"><div id="knob"></div></div>
  <label>Speed scale <input id="scale" type="range" min="0.2" max="1" step="0.1" value="0.5"></label>
  <div class="row">
    <button data-mode="autonomous">Autonomous</button>
    <button data-mode="teleop">Teleop</button>
    <button data-mode="stopped" id="stop">Stop</button>
  </div>
<script>
  // The car moves only while a finger holds the joystick; lifting it, or a silent 250 ms, brakes fully.
  const token = new URLSearchParams(location.search).get('token') || '';
  const ws = new WebSocket(`ws://${location.host}/ws?token=${encodeURIComponent(token)}`);
  const pad = document.getElementById('pad');
  const knob = document.getElementById('knob');
  const status = document.getElementById('status');
  const scale = document.getElementById('scale');
  let stick = { x: 0, y: 0, active: false };
  let seq = 0, rtt = null, state = {}, info = 'connecting…', notice = '';

  function show() {
    const speed = typeof state.speed === 'number' ? `${state.speed.toFixed(2)} m/s` : '–';
    const trip = rtt === null ? '–' : `${rtt.toFixed(1)} ms`;
    status.textContent = `${info} · mode ${state.mode ?? '–'} · ${speed} · round trip ${trip}${state.watchdog ? ' · watchdog brake' : ''}${notice ? ` · ${notice}` : ''}`;
    document.querySelectorAll('button[data-mode]').forEach((b) => b.classList.toggle('on', b.dataset.mode === state.mode));
  }
  function move(e) {
    const r = pad.getBoundingClientRect();
    const half = r.width / 2;
    let x = (e.clientX - r.left - half) / half;
    let y = (e.clientY - r.top - half) / half;
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    stick = { x, y, active: true };
    knob.style.left = `${39 + x * 39}%`;
    knob.style.top = `${39 + y * 39}%`;
  }
  function release() {
    stick = { x: 0, y: 0, active: false };
    knob.style.left = knob.style.top = '39%';
    pad.classList.remove('active');
  }
  pad.addEventListener('pointerdown', (e) => { pad.setPointerCapture(e.pointerId); pad.classList.add('active'); move(e); });
  pad.addEventListener('pointermove', (e) => { if (stick.active) move(e); });
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);
  // 30 messages per second. Positive steering turns left (Rushwick convention), so x is inverted; up is forward.
  setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const k = Number(scale.value);
    ws.send(JSON.stringify({ type: 'teleop', seq: seq++, sentAt: performance.now(), steering: -stick.x, throttle: -stick.y * k, deadman: stick.active }));
  }, 33);
  document.querySelectorAll('button[data-mode]').forEach((b) => b.addEventListener('click', () => ws.send(JSON.stringify({ type: 'mode', mode: b.dataset.mode }))));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'welcome') { info = m.controller ? 'you have control' : 'view only: another phone has control'; state.mode = m.mode; }
    if (m.type === 'teleop-ack') rtt = performance.now() - m.sentAt;
    if (m.type === 'mode') { state.mode = m.mode; notice = m.refused || ''; }
    if (m.type === 'telemetry' && m.topic === 'state') state = m.data;
    show();
  };
  ws.onclose = () => { info = 'disconnected: the car brakes'; show(); };
</script>
</body>
</html>
